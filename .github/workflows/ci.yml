name: CI

# Runs the unit suite, a production build, and the package-size budget on
# every push and PR. A v* tag also attaches the package to a GitHub Release;
# store submission is publish-store.yml.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run size

  package:
    # Only when a v* tag is pushed: build, zip the shipped files, attach to a
    # Release so you can grab the exact artifact to upload to each store.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - run: npm ci
      - run: npm run build

      - name: Package extension
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "skim-${VERSION}.zip" \
            manifest.json SKIM-QUIZ-PROTOCOL.md src dist vendor assets _locales examples LICENSE \
            -x '*/.DS_Store'
          ls -lh "skim-${VERSION}.zip"

      - name: Attach to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" skim-*.zip --repo "$GITHUB_REPOSITORY" --clobber
