name: CI

# Runs the unit suite, a production build, and the package-size budget on
# every push and PR. Publishing to the Chrome Web Store / Firefox AMO stays
# manual (store review + secrets), so there is no deploy job — but pushing a
# v* tag packages a ready-to-upload zip as a GitHub Release asset.
#
# Supply-chain notes:
# - Actions are pinned to commit SHAs (the trailing comment is the tag each
#   SHA was resolved from), so a moved tag upstream cannot change what runs.
# - No dependency cache: the package job ships what it builds, and a poisoned
#   Actions cache would feed straight into the release zip.
# - The token is read-only except in the package job, and checkout never
#   leaves it on disk (persist-credentials: false).

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run size

  package:
    # Only when a v* tag is pushed: build, zip the shipped files, attach to a
    # Release so you can grab the exact artifact to upload to each store.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false

      - run: npm ci
      - run: npm run build

      - name: Package extension
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "skim-${VERSION}.zip" \
            manifest.json SKIM-QUIZ-PROTOCOL.md src dist vendor assets _locales examples LICENSE \
            -x '*/.DS_Store'
          ls -lh "skim-${VERSION}.zip"

      - name: Attach to Release
        # GitHub's own CLI instead of a third-party action: one less party with
        # write access to releases. Creates the release on first run, replaces
        # the asset on a re-run of the same tag.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" skim-*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" skim-*.zip --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
