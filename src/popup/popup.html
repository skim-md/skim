<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../vendor/fonts.css"><link rel="stylesheet" href="popup.css"></head>
<body>
  <header class="skim-pop-head"><img src="../../assets/icon48.png" width="20" height="20" alt=""> <strong>Skim</strong></header>

  <section id="file-cta" hidden>
    <p id="file-cta-msg">To read <code>.md</code> files from your computer, Chrome needs one switch flipped:</p>
    <ol><li>Click the button below</li><li>Turn on <strong>“Allow access to file URLs”</strong></li></ol>
    <button id="open-settings" class="primary">Open Skim’s Chrome settings</button>
  </section>

  <section id="controls" hidden>
    <button id="clip-render" class="hero">
      <span class="hero-icon" aria-hidden="true">📋</span>
      <span class="hero-text">Render clipboard as MD<small>Opens your copied markdown in a new tab</small></span>
    </button>

    <button id="claude-clip" class="hero hero-mini hero-claude">
      <span class="hero-icon" aria-hidden="true">🦀</span>
      <span class="hero-text">Open Claude Clipboard</span>
    </button>

    <label class="row"><input type="checkbox" id="autoreload"> Auto-reload when the file changes</label>

    <p class="tip">Tip: right-click any <code>.md</code> file, Open with → <span id="browser-name">Chrome</span> (always), and local markdown will always open in Skim.</p>

    <button id="copy-quiz-skill" class="linkish">🎓 <span id="quiz-skill-label">Copy Skim Markdown Quiz Skill</span></button>
  </section>

  <footer>
    <a href="https://skim.md" target="_blank" rel="noopener">skim.md</a>
    <span class="dot">·</span>
    <a id="rate-link" href="https://chromewebstore.google.com/detail/skim-markdown-viewer-read/feeikgjlekgeepjljmnifkbnpcnflcmd/reviews" target="_blank" rel="noopener"><svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.8 5.9 6.5.8-4.8 4.5 1.2 6.4L12 17.1l-5.7 3.1 1.2-6.4-4.8-4.5 6.5-.8z"/></svg>Rate Skim</a>
    <span class="dot">·</span>
    <a href="https://github.com/skim-md/skim" target="_blank" rel="noopener">GitHub</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
